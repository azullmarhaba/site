<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { background: #111; margin: 0; padding: 24px; display: flex; flex-direction: column; gap: 24px; align-items: center; }
  canvas { width: 840px; height: 525px; border-radius: 12px; }
</style>
</head>
<body>
<canvas id="c1" width="1680" height="1050"></canvas>
<canvas id="c2" width="1680" height="1050"></canvas>
<canvas id="c3" width="1680" height="1050"></canvas>
<script>
const SAND = "#c89b6d";
const INK = "#080808";

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  if (typeof ctx.roundRect === "function") { ctx.roundRect(x, y, w, h, r); return; }
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawSpaced(ctx, text, x, y, spacing, align = "left") {
  const chars = [...text];
  const widths = chars.map((c) => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  let cx = align === "center" ? x - total / 2 : align === "right" ? x - total : x;
  chars.forEach((c, i) => { ctx.fillText(c, cx, y); cx += widths[i] + spacing; });
  return total;
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function drawCoverFit(ctx, img, w, h) {
  const ir = img.naturalWidth / img.naturalHeight;
  const r = w / h;
  let dw, dh;
  if (ir > r) { dh = h; dw = h * ir; } else { dw = w; dh = w / ir; }
  ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
}

async function renderBadge(canvas, data) {
  const W = 1680, H = 1050;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  try {
    await Promise.all([
      document.fonts.load('600 90px Fraunces'),
      document.fonts.load('500 70px Fraunces'),
      document.fonts.load('500 34px Inter'),
      document.fonts.load('600 40px Inter'),
      document.fonts.load('700 44px Inter'),
    ]);
    await document.fonts.ready;
  } catch (e) {}

  if (data.coverImage) {
    try {
      const img = await loadImage(data.coverImage.path);
      drawCoverFit(ctx, img, W, H);
    } catch (e) {
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, "#17130f"); g.addColorStop(0.55, "#111111"); g.addColorStop(1, "#080808");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  } else {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "#17130f"); g.addColorStop(0.55, "#111111"); g.addColorStop(1, "#080808");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  const overlay = ctx.createLinearGradient(0, 0, 0, H);
  overlay.addColorStop(0, "rgba(0,0,0,0.18)");
  overlay.addColorStop(0.45, "rgba(0,0,0,0.32)");
  overlay.addColorStop(1, "rgba(0,0,0,0.86)");
  ctx.fillStyle = overlay;
  ctx.fillRect(0, 0, W, H);

  const pad = 100;
  const cursorY = pad + 14;

  roundRectPath(ctx, pad, cursorY, 150, 150, 34);
  ctx.fillStyle = SAND;
  ctx.fill();
  ctx.fillStyle = INK;
  ctx.font = "600 84px Fraunces, Georgia, serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("A", pad + 75, cursorY + 82);

  const textX = pad + 190;
  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(255,255,255,0.96)";
  ctx.font = "600 58px Fraunces, Georgia, serif";
  ctx.fillText("AZUL — MARHABA MOROCCO", textX, cursorY + 58);
  ctx.font = "500 27px Inter, system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  drawSpaced(ctx, "MARRAKECH · SAHARA · ATLAS · ATLANTIC", textX + 2, cursorY + 116, 10);

  ctx.font = "600 26px Inter, system-ui, sans-serif";
  const statusText = data.status.toUpperCase();
  const chipPadX = 26;
  const chipW = ctx.measureText(statusText).width + chipPadX * 2;
  const chipH = 58;
  const chipX = W - pad - chipW;
  roundRectPath(ctx, chipX, pad + 14, chipW, chipH, chipH / 2);
  ctx.fillStyle = "rgba(255,255,255,0.1)";
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  drawSpaced(ctx, statusText, chipX + chipPadX, pad + 14 + chipH / 2 + 1, 6);

  const colX = pad;
  const colW = W - pad * 2;
  const hasDiscount = data.discountMinor > 0;
  const gridTop = 470;
  const cellH = 140;
  const gridBottom = gridTop + cellH * 2;

  ctx.textAlign = "left";
  ctx.font = "500 27px Inter, system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  drawSpaced(ctx, "BOOKING REFERENCE", colX, 330, 10);
  ctx.font = "600 66px Fraunces, Georgia, serif";
  ctx.fillStyle = "rgba(255,255,255,0.97)";
  ctx.fillText(data.reference, colX, 406);

  const cellW = colW / 2 - 30;
  const cellGap = 60;
  const facts = [
    { label: "EXPERIENCE", value: data.experienceTitle },
    { label: "DATE", value: data.dateStr, sub: data.departureTime },
    { label: "GUESTS", value: data.guestsStr },
    { label: "TOTAL", value: data.totalStr, accent: true },
  ];

  facts.forEach((f, i) => {
    const fx = colX + (i % 2) * (cellW + cellGap);
    const fy = gridTop + Math.floor(i / 2) * cellH;
    ctx.textAlign = "left";
    ctx.font = "500 23px Inter, system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    drawSpaced(ctx, f.label, fx, fy, 8);
    if (f.accent) {
      ctx.font = "600 44px Fraunces, Georgia, serif";
      ctx.fillStyle = SAND;
    } else {
      ctx.font = "500 36px Inter, system-ui, sans-serif";
      ctx.fillStyle = "rgba(255,255,255,0.9)";
    }
    let value = f.value;
    while (value.length > 4 && ctx.measureText(value).width > cellW) value = value.slice(0, -1);
    if (value !== f.value) value = value.slice(0, -1) + "…";
    ctx.fillText(value, fx, fy + 56);
    if (f.sub) {
      ctx.font = "400 26px Inter, system-ui, sans-serif";
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.fillText(f.sub, fx, fy + 100);
    }
  });

  const couponH = 64;
  const couponTop = gridBottom + 20;
  if (hasDiscount) {
    const stripW = colW * 0.62;
    roundRectPath(ctx, colX, couponTop, stripW, couponH, 18);
    ctx.fillStyle = "rgba(200,155,109,0.14)";
    ctx.fill();
    ctx.strokeStyle = "rgba(200,155,109,0.35)";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.textAlign = "left";
    ctx.font = "600 25px Inter, system-ui, sans-serif";
    ctx.fillStyle = SAND;
    const couponText = "COUPON " + (data.couponCode || "");
    drawSpaced(ctx, couponText, colX + 32, couponTop + couponH / 2 + 1, 6);
    ctx.font = "600 30px Inter, system-ui, sans-serif";
    const discountText = "-" + data.discountStr + (data.couponPercentOff ? " (" + data.couponPercentOff + "% OFF)" : "");
    ctx.fillText(discountText, colX + 32 + ctx.measureText(couponText).width + 60, couponTop + couponH / 2 + 1);
  }

  const dividerY = (hasDiscount ? couponTop + couponH : gridBottom) + 44;
  ctx.strokeStyle = "rgba(255,255,255,0.1)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(colX, dividerY);
  ctx.lineTo(colX + colW, dividerY);
  ctx.stroke();

  ctx.textAlign = "left";
  ctx.font = "500 22px Inter, system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.4)";
  drawSpaced(ctx, "GUEST", colX, dividerY + 36, 8);
  ctx.font = "500 32px Inter, system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.fillText(data.customerName, colX, dividerY + 74);
  ctx.font = "400 24px Inter, system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.fillText(data.customerEmail, colX, dividerY + 110);

  ctx.textAlign = "right";
  ctx.font = "500 22px Inter, system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.4)";
  drawSpaced(ctx, "PAID", colX + colW, dividerY + 36, 8, "right");
  ctx.font = "600 30px Inter, system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.fillText(data.currency, colX + colW, dividerY + 74);

  ctx.textAlign = "center";
  ctx.font = "500 26px Inter, system-ui, sans-serif";
  ctx.fillStyle = "rgba(245,241,232,0.3)";
  drawSpaced(ctx, "AZUL · MARHABA MOROCCO", W / 2, H - 26, 12, "center");
}

const base = {
  reference: "AZL-2027-000007",
  status: "CONFIRMED",
  date: "2027-10-29T00:00:00.000Z",
  dateStr: "29 October 2027",
  departureTime: "08:30",
  experienceTitle: "Agafay",
  guestsStr: "1 adult",
  totalStr: "MAD 2.50",
  currency: "MAD",
  customerName: "ABDESSAMAD BABA",
  customerEmail: "abdessamad.baba@gmail.com",
};

(async () => {
  await renderBadge(document.getElementById("c1"), { ...base, coverImage: { path: "/uploads/2026-10/44017251-705f-4f3a-88b0-cec4eed27fa7.jpg" } });
  await renderBadge(document.getElementById("c2"), { ...base, coverImage: null });
  await renderBadge(document.getElementById("c3"), {
    ...base,
    coverImage: { path: "/uploads/2026-10/44017251-705f-4f3a-88b0-cec4eed27fa7.jpg" },
    experienceTitle: "Agafay Sunset Camel Ride & Atlas Mountains Discovery Day Tour",
    discountMinor: 2500,
    discountStr: "MAD 25.00",
    couponCode: "WELCOME10",
    couponPercentOff: 10,
    guestsStr: "2 adults + 1 child",
  });
  document.title = "done";
})();
</script>
</body>
</html>
